[package]
name = "aegis_relayer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sui SDK — match versions you already resolved in backend_api
sui-sdk = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-sdk", rev = "mainnet-v1.66.2" }
shared-crypto = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/shared-crypto", rev = "mainnet-v1.66.2" }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
tokio-retry = "0.3"